name: Import Open Camera source

# git.code.sf.net is not reachable from the development sandbox, so the
# upstream source is pulled in by a GitHub runner and committed to the branch.
on:
  push:
    paths:
      - .github/workflows/import-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream and copy into repo
        run: |
          git clone --depth 1 https://git.code.sf.net/p/opencamera/code /tmp/oc
          echo "$(git -C /tmp/oc rev-parse HEAD)" > UPSTREAM_COMMIT
          rm -rf /tmp/oc/.git
          cp -a /tmp/oc/. .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Open Camera upstream source ($(cat UPSTREAM_COMMIT))"
          git push
